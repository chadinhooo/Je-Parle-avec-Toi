<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon Monde">
<meta name="description" content="Parler en touchant son monde : des scènes de la maison, du corps et des gens, pour les enfants et adultes qui ne parlent pas ou peu.">
<title>Mon Monde</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/FiraSans-SemiBold.woff" as="font" type="font/woff" crossorigin>
<style>@font-face { font-family: 'Fira Sans'; src: url(fonts/FiraSans-Regular.woff) format('woff'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Fira Sans'; src: url(fonts/FiraSans-SemiBold.woff) format('woff'); font-weight: 600 700; font-display: swap; }
:root {
  --bg: #F4F6F8; --surf: #FFFFFF; --ink: #161C2B; --mute: #566176; --line: #D7DCE4; --acc: #4338CA; --acc-t: #E6E4FA; --acc-ink: #FFFFFF; --plate: #FFFFFF;
  --pers: #E2AE00; --pers-t: #FFF4C7; --verb: #2E9A50; --verb-t: #DFF3E5; --desc: #2F7FE0; --desc-t: #DFEBFC;
  --noun: #E9821E; --noun-t: #FDE8D3; --soc: #D4428A; --soc-t: #FBE0EC; --q: #8A4FD6; --q-t: #EEE3FB; --neg: #D7383B; --neg-t: #FBDEDE;
  color-scheme: light;
}
[data-theme=dark] {
  --bg: #12161D; --surf: #1B212C; --ink: #EEF1F7; --mute: #A7B0C2; --line: #2F3848; --acc: #A5B4FC; --acc-t: #262B4D; --acc-ink: #111633; --plate: #F4F6FA;
  --pers: #F2C230; --pers-t: #3A3317; --verb: #4CC172; --verb-t: #183424; --desc: #66A3F2; --desc-t: #172B45;
  --noun: #F29A44; --noun-t: #3D2715; --soc: #EC6FAA; --soc-t: #3D1A2C; --q: #AE83EE; --q-t: #2C1F45; --neg: #F0605F; --neg-t: #41191B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: 'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ui { width: 24px; height: 24px; flex: none; }
[hidden] { display: none !important; }
.c-pers { --c: var(--pers); --ct: var(--pers-t); } .c-verb { --c: var(--verb); --ct: var(--verb-t); } .c-desc { --c: var(--desc); --ct: var(--desc-t); }
.c-noun { --c: var(--noun); --ct: var(--noun-t); } .c-soc { --c: var(--soc); --ct: var(--soc-t); } .c-q { --c: var(--q); --ct: var(--q-t); } .c-neg { --c: var(--neg); --ct: var(--neg-t); }
.pic svg, .pic img { display: block; width: 100%; height: 100%; object-fit: cover; }

#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }

/* Mots urgents */
#urg { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; padding: 8px 8px 0; flex: none; }
.urg { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 62px; padding: 5px 2px 4px; border-radius: 14px; border: 3px solid var(--c); background: var(--ct); }
.urg .pic { width: 32px; height: 32px; background: var(--plate); border-radius: 8px; padding: 2px; }
.urg .lbl { font-size: 12px; letter-spacing: -.01em; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Scène */
#bubble.idle { background: var(--surf); color: var(--mute); box-shadow: none; border: 1px dashed var(--line); }
#bubble.idle .btx { font-size: 17px; font-weight: 400; }
#bubble.idle .bic, #bubble.idle .ui { display: none; }
#stage { position: relative; flex: 1; min-height: 0; margin: 8px; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); }
#scene { position: absolute; inset: 0; display: flex; }
#scene .scene { width: 100%; height: 100%; }
.sc-moi { background: #EEF3FA; } .sc-cuisine { background: linear-gradient(#F2E6CF 65%, #D8BE95 65%); } .sc-salon { background: linear-gradient(#DCEBF2 66.2%, #C9AE88 66.2%); }
.sc-bain { background: linear-gradient(#D7EEF0 68.7%, #A9C8D1 68.7%); } .sc-chambre { background: linear-gradient(#E6E1F5 62.5%, #CDB894 62.5%); } .sc-dehors { background: linear-gradient(#CDE9FF 59%, #9BD17A 59%); }
.sc-photo { background: #1B212C; } .sc-gens { background: var(--surf); }
.hot { cursor: pointer; outline: none; }
.hot.on, .hot:focus-visible { filter: drop-shadow(0 0 5px #4338CA) drop-shadow(0 0 2px #4338CA); }
@media (hover: hover) { .hot:hover { filter: brightness(1.06); } }
.zone circle { fill: #fff; fill-opacity: .22; stroke: #fff; stroke-width: 4; vector-effect: non-scaling-stroke; }
.zone.on circle { stroke: #A5B4FC; }
.people { width: 100%; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 12px; align-content: start; }
.pcard { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px; border-radius: 18px; border: 3px solid var(--c); background: var(--ct); }
.pcard .pic { width: 100%; aspect-ratio: 1; background: var(--plate); border-radius: 12px; overflow: hidden; padding: 6%; }
.pcard .pic img { margin: -6%; width: 112%; height: 112%; }
.pcard .lbl { font-weight: 600; font-size: 19px; }

/* Bulle de parole : le moment fort */
#bubble { flex: none; margin: 8px 8px 0; min-height: 68px; display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border: 0; border-radius: 20px 20px 20px 6px; background: var(--acc); color: var(--acc-ink); text-align: left; box-shadow: 0 6px 18px rgba(20, 24, 60, .25); }
.bic { width: 48px; height: 48px; flex: none; background: var(--plate); border-radius: 12px; padding: 3px; display: flex; overflow: hidden; }
.bic svg, .bic img { width: 100%; height: 100%; object-fit: cover; }
.btx { flex: 1; font-size: clamp(20px, 5.4vw, 30px); font-weight: 600; line-height: 1.15; }
@media (prefers-reduced-motion: no-preference) { #bubble:not(.idle) { animation: pop .28s cubic-bezier(.2, 1.4, .4, 1); transform-origin: 20px 100%; } @keyframes pop { from { transform: scale(.6); opacity: 0; } } .opt, .urg { transition: transform .08s; } .opt:active, .urg:active { transform: scale(.96); } }

/* Pièces */
#rooms { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; background: var(--surf); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); flex: none; }
#rooms::-webkit-scrollbar { display: none; }
#rooms button { position: relative; flex: none; width: 74px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 2px; border: 0; background: none; border-radius: 14px; color: var(--mute); }
.rpic { width: 46px; height: 46px; border-radius: 50%; background: var(--plate); border: 2px solid var(--line); padding: 4px; display: flex; overflow: hidden; }
.rpic svg, .rpic img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.rl { font-size: 12px; font-weight: 600; line-height: 1.1; text-align: center; }
#rooms button[aria-current=true] { color: var(--acc); }
#rooms button[aria-current=true] .rpic { border: 3px solid var(--acc); }
.nowdot { position: absolute; top: 4px; right: 12px; width: 12px; height: 12px; border-radius: 50%; background: var(--verb); border: 2px solid var(--surf); }
#rooms .adultbtn { margin-left: auto; border-left: 1px solid var(--line); border-radius: 0; padding-left: 6px; width: 80px; }
@media (min-width: 760px) { #rooms { justify-content: center; } #rooms .adultbtn { margin-left: 24px; } }

/* Fiche de choix */
#sheet { position: fixed; inset: 0; z-index: 20; background: rgba(10, 14, 22, .45); display: flex; align-items: flex-end; justify-content: center; }
.sh-card { width: min(100%, 680px); max-height: 88dvh; overflow-y: auto; background: var(--surf); border-radius: 24px 24px 0 0; padding: 12px 14px calc(16px + env(safe-area-inset-bottom)); }
@media (min-width: 760px) and (min-height: 600px) { #sheet { align-items: center; } .sh-card { border-radius: 24px; } }
.sh-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.sh-ic { width: 48px; height: 48px; flex: none; background: var(--plate); border: 1px solid var(--line); border-radius: 12px; padding: 3px; display: flex; overflow: hidden; }
.sh-ic svg, .sh-ic img { width: 100%; height: 100%; object-fit: cover; }
.sh-top h2 { flex: 1; margin: 0; font-size: 22px; }
.neg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.neg button { display: flex; align-items: center; gap: 8px; min-height: 54px; padding: 4px 10px 4px 6px; border-radius: 14px; border: 2px solid var(--line); background: var(--surf); font-weight: 600; font-size: 16px; text-align: left; }
.neg [data-neg="0"][aria-checked=true] { border: 3px solid var(--verb); background: var(--verb-t); }
.neg [data-neg="1"][aria-checked=true] { border: 3px solid var(--neg); background: var(--neg-t); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opts.n5, .opts.n6, .opts.n7, .opts.n8, .opts.n9 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (min-width: 600px) { .opts.n7, .opts.n8, .opts.n9 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.opt { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; border-radius: 16px; border: 3px solid var(--c); background: var(--ct); min-width: 0; }
.opt .pic { width: 100%; max-width: 140px; aspect-ratio: 1; background: var(--plate); border-radius: 12px; padding: 6%; overflow: hidden; }
.opt .pic img { margin: -6%; width: 112%; height: 112%; }
.opt .lbl { font-weight: 600; font-size: clamp(14px, 3.8vw, 19px); line-height: 1.15; text-align: center; overflow-wrap: break-word; hyphens: auto; max-width: 100%; }
.mini { width: 40px; height: 40px; flex: none; border-radius: 8px; background: var(--plate); padding: 2px; display: inline-flex; overflow: hidden; }
.mini.big { width: 52px; height: 52px; }
.mini svg, .mini img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }

/* Espace adulte */
#adult { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.ahead { padding: 10px 12px 0; max-width: 780px; margin: 0 auto; }
.atabs { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--bg); border-bottom: 1px solid var(--line); max-width: 780px; margin: 8px auto 0; }
.atabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; border: 0; background: none; color: var(--mute); font-size: 13px; font-weight: 600; border-bottom: 3px solid transparent; }
.atabs [aria-selected=true] { color: var(--acc); border-bottom-color: var(--acc); }
.abody { max-width: 780px; margin: 0 auto; padding: 14px 16px 32px; }
h2 { font-size: 20px; margin: 8px 0 12px; }
.hint { color: var(--mute); line-height: 1.45; margin: 4px 0 12px; }
.btn { min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surf); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.btn.primary { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.btn.danger { color: var(--neg); border-color: var(--neg); }
.btn.big { width: 100%; min-height: 58px; justify-content: center; font-size: 18px; }
.iconbtn { width: 48px; height: 48px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--surf); display: inline-flex; align-items: center; justify-content: center; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chips2 { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
.qchip { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surf); font-weight: 600; }
.sel { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 48px; }
.selc { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 3px 8px 3px 3px; border-radius: 12px; border: 2px solid var(--c); background: var(--ct); font-weight: 600; }
.selc .ui { width: 18px; height: 18px; }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-bottom: 12px; }
.libw { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px; min-height: 84px; border-radius: 12px; border: 1px solid var(--line); background: var(--surf); font-size: 13px; font-weight: 600; }
.libw .mini { width: 48px; height: 48px; }
.libw.is-on { border: 3px solid var(--acc); background: var(--acc-t); }
.stick { position: sticky; bottom: 0; padding: 10px 0; background: var(--bg); }
.fil { list-style: none; padding: 0; margin: 0 0 16px; display: flex; flex-direction: column; gap: 6px; }
.fil .day { align-self: center; color: var(--mute); font-size: 14px; margin: 10px 0 4px; }
.msg { max-width: 82%; padding: 10px 14px; border-radius: 18px; font-size: 18px; }
.msg time { display: block; font-size: 12px; opacity: .7; margin-top: 2px; }
.from-c { align-self: flex-end; background: var(--acc); color: var(--acc-ink); border-bottom-right-radius: 6px; }
.from-a { align-self: flex-start; background: var(--surf); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
textarea { width: 100%; min-height: 36vh; font-size: 26px; line-height: 1.3; border-radius: 16px; border: 1px solid var(--line); background: var(--surf); padding: 14px; resize: vertical; }

/* Question montrée à l'enfant */
#ask { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; padding: calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom)); }
.askx { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px; }
.askq { font-size: clamp(26px, 7vw, 44px); font-weight: 600; text-align: center; margin: 44px 8px 18px; line-height: 1.15; }
.askg { flex: 1; min-height: 0; display: grid; gap: 14px; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); }
.askg.n1 { grid-template-columns: 1fr; }
.askg .opt { display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center; overflow: hidden; }
.askg .opt .pic { width: 100%; height: 100%; min-height: 0; max-width: none; aspect-ratio: auto; background: none; padding: 0; display: flex; justify-content: center; }
.askg .opt .pic svg, .askg .opt .pic img { width: auto; height: 100%; max-width: 100%; aspect-ratio: 1; background: var(--plate); border-radius: 14px; padding: 4%; }
.askg .opt .pic img { padding: 0; margin: 0; }
.askg .opt .lbl { font-size: clamp(18px, 5vw, 28px); }
.askg .opt.dim { opacity: .3; }
.askfoot { display: flex; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

/* Code parent et réglages */
.lock { max-width: 340px; margin: 0 auto; text-align: center; }
.lock .err { color: var(--neg); font-weight: 600; }
.dots { display: flex; justify-content: center; gap: 14px; margin: 16px 0 22px; }
.dots span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); }
.dots .on { background: var(--ink); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pad button { height: 68px; border-radius: 16px; border: 1px solid var(--line); background: var(--surf); font-size: 28px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.ptop { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
details { background: var(--surf); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; padding: 0 16px; }
details[open] { padding-bottom: 16px; }
summary { font-weight: 600; font-size: 18px; min-height: 56px; display: flex; align-items: center; cursor: pointer; }
.f { display: grid; gap: 6px; margin: 12px 0; font-weight: 600; }
.f input:not([type=range]), .f select, .plist input { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; font-size: 17px; font-weight: 400; min-width: 0; }
.f input[type=range] { width: 100%; min-height: 40px; accent-color: var(--acc); }
.flabel { font-weight: 600; margin: 14px 0 6px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); font-weight: 600; cursor: pointer; }
.seg input:checked + span { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.seg input:focus-visible + span { outline: 3px solid var(--acc); outline-offset: 2px; }
.chk { display: flex; align-items: center; gap: 10px; min-height: 48px; flex: 1; }
.chk input { width: 22px; height: 22px; accent-color: var(--acc); flex: none; }
.plist, .olist, .routine { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 6px; }
.plist li, .olist li { display: flex; align-items: center; gap: 8px; }
.plist input { flex: 1; }
.plist .grow { flex: 1; font-weight: 600; }
.olist li { border-bottom: 1px solid var(--line); }
.routine li { padding: 6px 0; border-bottom: 1px solid var(--line); }
.routine b { display: inline-block; width: 64px; }
.add { border: 1px dashed var(--line); border-radius: 12px; margin-top: 12px; padding: 4px 14px 14px; }
.add legend { font-weight: 600; padding: 0 6px; }
.photo { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
.edwrap { background: #1B212C; border-radius: 14px; overflow: hidden; }
.edsvg { display: block; width: 100%; max-height: 62vh; cursor: crosshair; }
.zc { fill: #fff; fill-opacity: .25; stroke: #A5B4FC; stroke-width: 4; vector-effect: non-scaling-stroke; cursor: pointer; }
.zc.sel { stroke: #F0605F; fill-opacity: .35; }
#toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600; z-index: 50; }
@media (max-height: 640px) { .urg { min-height: 52px; } .urg .pic { width: 26px; height: 26px; } .rpic { width: 38px; height: 38px; } }
</style>
</head>
<body>
<div id="app">
  <div id="urg"></div>
  <button id="bubble" class="idle"></button>
  <div id="stage"><div id="scene"></div></div>
  <nav id="rooms" aria-label="Pièces"></nav>
</div>
<div id="sheet" hidden></div>
<div id="adult" hidden></div>
<div id="ask" hidden role="dialog" aria-modal="true"></div>
<div id="toast" role="status" hidden></div>
<script>/* Pictogrammes dessinés pour l'appli (pas de licence tierce). Grille 64x64. */
const K = '#22293A', SK = '#F7CBA5', HB = '#6B4A2F', HG = '#C9CED6', HY = '#E3B04B',
  RED = '#E5484D', BLU = '#3B82F6', GRN = '#3BA55C', YEL = '#F7C948', ORA = '#F08A24',
  PUR = '#8B5CF6', PNK = '#F27BB0', BRN = '#9A6236', WH = '#FFFFFF', LB = '#BFE3FF', CRM = '#F6E3BE';
const NS = 'stroke="none"';
const c = (x, y, r, f = 'none', e = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${e}/>`;
const el = (x, y, rx, ry, f = 'none', e = '') => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" ${e}/>`;
const r = (x, y, w, h, rx, f = 'none', e = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" ${e}/>`;
const p = (d, f = 'none', e = '') => `<path d="${d}" fill="${f}" ${e}/>`;
const t = (x, y, s, txt, f = K) => `<text x="${x}" y="${y}" font-size="${s}" font-weight="700" font-family="Fira Sans,system-ui,sans-serif" fill="${f}" stroke="none" text-anchor="middle">${txt}</text>`;
const dot = (x, y, s = 1.6) => c(x, y, s, K, NS);

function face(cx, cy, R, mood = 'happy', fill = SK) {
  const ex = R * 0.36, ey = cy - R * 0.1, m = cy + R * 0.38;
  let s = c(cx, cy, R, fill), eyes = dot(cx - ex, ey, R * 0.09) + dot(cx + ex, ey, R * 0.09);
  const arc = (y1, y2) => p(`M${cx - R * .38} ${y1} Q${cx} ${y2} ${cx + R * .38} ${y1}`);
  switch (mood) {
    case 'happy': return s + eyes + arc(m - R * .08, m + R * .32);
    case 'sad': return s + eyes + arc(m + R * .18, m - R * .2) + p(`M${cx - ex - R * .2} ${ey - R * .3} L${cx - ex + R * .15} ${ey - R * .42} M${cx + ex + R * .2} ${ey - R * .3} L${cx + ex - R * .15} ${ey - R * .42}`) + el(cx + ex + R * .05, ey + R * .32, R * .07, R * .12, LB, NS);
    case 'angry': return c(cx, cy, R, '#F6A9A0') + eyes + p(`M${cx - ex - R * .22} ${ey - R * .38} L${cx - ex + R * .2} ${ey - R * .18} M${cx + ex + R * .22} ${ey - R * .38} L${cx + ex - R * .2} ${ey - R * .18}`) + arc(m + R * .12, m - R * .12);
    case 'tired': return s + p(`M${cx - ex - R * .14} ${ey} q${R * .14} ${R * .12} ${R * .28} 0 M${cx + ex - R * .14} ${ey} q${R * .14} ${R * .12} ${R * .28} 0`) + el(cx, m + R * .05, R * .1, R * .13, K, NS) + t(cx + R * .95, cy - R * .7, R * .55, 'z');
    case 'scared': return s + c(cx - ex, ey, R * .17, WH) + c(cx + ex, ey, R * .17, WH) + dot(cx - ex, ey, R * .07) + dot(cx + ex, ey, R * .07) + p(`M${cx - ex - R * .2} ${ey - R * .36} Q${cx - ex} ${ey - R * .5} ${cx - ex + R * .2} ${ey - R * .36} M${cx + ex - R * .2} ${ey - R * .36} Q${cx + ex} ${ey - R * .5} ${cx + ex + R * .2} ${ey - R * .36}`) + el(cx, m + R * .06, R * .13, R * .19, K, NS);
    case 'sick': return c(cx, cy, R, '#CDE7B0') + p(`M${cx - ex - R * .14} ${ey} h${R * .28} M${cx + ex - R * .14} ${ey} h${R * .28}`) + p(`M${cx - R * .34} ${m + R * .05} q${R * .11} -${R * .14} ${R * .22} 0 q${R * .11} ${R * .14} ${R * .22} 0 q${R * .11} -${R * .14} ${R * .22} 0`);
    case 'calm': return s + p(`M${cx - ex - R * .14} ${ey + R * .04} q${R * .14} -${R * .14} ${R * .28} 0 M${cx + ex - R * .14} ${ey + R * .04} q${R * .14} -${R * .14} ${R * .28} 0`) + arc(m - R * .05, m + R * .18);

    case 'open': return s + eyes + el(cx, m + R * .05, R * .2, R * .16, '#8A2A2F');
    default: return s + eyes + p(`M${cx - R * .25} ${m + R * .05} h${R * .5}`);
  }
}

/* Personnage : x centre, s échelle (1 adulte, .74 enfant), o = {hair, hc, shirt, glasses, mood} */
function person(x, s, o = {}) {
  const top = 61 - 50 * s, hr = 7.6 * s, hy = top + 8.5 * s, hc = o.hc || HB, sh = o.shirt || BLU;
  const cap = p(`M${x - hr} ${hy + 1 * s} Q${x - hr - 1 * s} ${hy - hr * 1.35} ${x} ${hy - hr * 1.05} Q${x + hr + 1 * s} ${hy - hr * 1.35} ${x + hr} ${hy + 1 * s} Q${x} ${hy - hr * .55} ${x - hr} ${hy + 1 * s}Z`, hc);
  let back = '', front = '';
  if (o.hair === 'long') back = p(`M${x - hr - 1.5 * s} ${hy} Q${x - hr - 3 * s} ${hy + hr * 1.7} ${x - hr + 2 * s} ${hy + hr * 1.8} L${x + hr - 2 * s} ${hy + hr * 1.8} Q${x + hr + 3 * s} ${hy + hr * 1.7} ${x + hr + 1.5 * s} ${hy}Z`, hc);
  if (o.hair === 'bun') back = c(x, hy - hr * 1.1, hr * .45, hc);
  if (o.hair === 'pig') back = c(x - hr - 1.5 * s, hy - 1 * s, hr * .45, hc) + c(x + hr + 1.5 * s, hy - 1 * s, hr * .45, hc);
  if (o.hair !== 'bald') front = cap; else front = p(`M${x - hr} ${hy} q${-1 * s} ${-hr * .6} ${hr * .3} ${-hr * .7} M${x + hr} ${hy} q${1 * s} ${-hr * .6} ${-hr * .3} ${-hr * .7}`, 'none', `stroke="${HG}" stroke-width="${3 * s}"`);
  const ey = hy + .5 * s;
  let fc = dot(x - hr * .38, ey, 1.2 * s + .3) + dot(x + hr * .38, ey, 1.2 * s + .3) + p(`M${x - hr * .32} ${hy + hr * .42} Q${x} ${hy + hr * .68} ${x + hr * .32} ${hy + hr * .42}`, 'none', `stroke-width="${2 * s}"`);
  if (o.glasses) fc += c(x - hr * .38, ey, hr * .3, 'none', `stroke-width="${1.6 * s}"`) + c(x + hr * .38, ey, hr * .3, 'none', `stroke-width="${1.6 * s}"`);
  const ty = top + 17 * s, by = top + 38 * s;
  const arms = o.armsUp
    ? p(`M${x - 8 * s} ${ty + 3 * s} L${x - 15 * s} ${ty - 9 * s} M${x + 8 * s} ${ty + 3 * s} L${x + 15 * s} ${ty - 9 * s}`, 'none', `stroke-width="${3.2 * s}"`)
    : p(`M${x - 8 * s} ${ty + 3 * s} L${x - 13 * s} ${ty + 17 * s} M${x + 8 * s} ${ty + 3 * s} L${x + 13 * s} ${ty + 17 * s}`, 'none', `stroke-width="${3.2 * s}"`);
  const legs = p(`M${x - 4.5 * s} ${by} L${x - 5 * s} 61 M${x + 4.5 * s} ${by} L${x + 5 * s} 61`, 'none', `stroke-width="${3.6 * s}"`);
  const body = o.dress
    ? p(`M${x - 8 * s} ${ty} Q${x} ${ty - 3 * s} ${x + 8 * s} ${ty} L${x + 13 * s} ${by + 4 * s} L${x - 13 * s} ${by + 4 * s}Z`, sh)
    : p(`M${x - 8.5 * s} ${ty} Q${x} ${ty - 3 * s} ${x + 8.5 * s} ${ty} L${x + 9.5 * s} ${by} L${x - 9.5 * s} ${by}Z`, sh);
  return back + legs + arms + body + c(x, hy, hr, SK) + front + fc;
}

function hand(x, y, s = 1, f = SK) {
  let g = '';
  [-7.5, -2.5, 2.5, 7.5].forEach((dx, i) => { g += r(x + dx * s - 2.4 * s, y - (i === 0 || i === 3 ? 12 : 16) * s, 4.8 * s, 20 * s, 2.4 * s, f); });
  g += p(`M${x - 10 * s} ${y + 2 * s} L${x - 16 * s} ${y - 6 * s} Q${x - 19 * s} ${y - 2 * s} ${x - 14 * s} ${y + 8 * s}`, f);
  g += p(`M${x - 10 * s} ${y} H${x + 10 * s} V${y + 12 * s} Q${x + 10 * s} ${y + 20 * s} ${x} ${y + 20 * s} Q${x - 10 * s} ${y + 20 * s} ${x - 10 * s} ${y + 12 * s}Z`, f);
  return g;
}

/* ---------- Grammaire française ---------- */
const VOY = /^[aeiouàâäéèêëîïôöûüœ]/i; // pas de « y » : on dit « de yaourt »
const grammarFR = {
  def(w) { return w.g === 'p' ? 'les ' + w.fr : VOY.test(w.fr) ? "l'" + w.fr : (w.g === 'f' ? 'la ' : 'le ') + w.fr; },
  indef(w) {
    if (w.g === 'p') return 'des ' + w.fr;
    if (w.m) return (VOY.test(w.fr) ? "de l'" : w.g === 'f' ? 'de la ' : 'du ') + w.fr;
    return (w.g === 'f' ? 'une ' : 'un ') + w.fr;
  },
  de(s) { return (VOY.test(s) ? "d'" : 'de ') + s; },
  a(w) { return w.raw ? w.fr : w.g === 'p' ? 'aux ' + w.fr : VOY.test(w.fr) ? "à l'" + w.fr : (w.g === 'f' ? 'à la ' : 'au ') + w.fr; },
  noun(w, s) {
    if (w.pos) return s === 'besoin' ? this.de(w.pos) : s === 'vais' ? 'à ' + w.pos : w.pos;
    if (w.d && s !== 'neveux' && s !== 'besoin') return this.def(w);
    switch (s) {
      case 'neveux': return this.de(w.fr);
      case 'besoin': return w.m || w.g === 'p' ? this.de(w.fr) : this.de(this.indef(w));
      case 'aime': case 'naime': case 'ouest': case 'mal': return this.def(w);
      case 'vais': return this.a(w);
      default: return this.indef(w);
    }
  },
  obj(w, s, gender) {
    switch (w.k) {
      case 'noun': return this.noun(w, s);
      case 'body': return s === 'mal' || !s ? this.a(w) : w.raw ? w.fr : this.def(w);
      case 'verb': return s === 'besoin' ? this.de(w.fr) : w.fr;
      case 'place':
        if (s === 'vais') return w.fa;
        if (s === 'aime' || s === 'naime' || s === 'ouest' || s === 'cest') return w.fd;
        return (s === 'besoin' ? "d'aller " : 'aller ') + w.fa;
      case 'pers': return s === 'vais' ? 'chez ' + w.fr : s === 'besoin' ? this.de(w.fr) : w.fr;
      default: return w.fr;
    }
  },
  start(s) { return WD[s].fr; },
  feel(adj, av, fx, gender) {
    const out = [];
    if (adj.length) out.push('je suis ' + list(adj.map((w) => w.fr[gender === 'f' ? 1 : 0]), 'et'));
    if (av.length) out.push("j'ai " + list(av.map((w) => w.fr), 'et'));
    fx.forEach((w) => out.push(w.fx));
    return out.join(' et ');
  },
  head(s, objs) { if (s === 'ouest' && objs.some((o) => o.g === 'p' && !o.pos)) return 'où sont'; return WD[s].fr; },
  and: 'et',
  infer(k) { return { body: 'mal', verb: 'veux', place: 'veux' }[k] || null; },
  q(s) { return s === 'ouest' ? ' ?' : ''; },
};

/* ---------- Grammaire anglaise ---------- */
const grammarEN = {
  e(w) { return (GB() && w.gb && typeof w.gb === 'string') ? w.gb : w.en; },
  a(s) { return (/^[aeiou]/i.test(s) ? 'an ' : 'a ') + s; },
  noun(w, s) {
    const e = this.e(w);
    if (w.epos) return w.epos;
    if (w.ec === 'the') return 'the ' + e;
    switch (s) {
      case 'neveux': return w.ec === 'count' ? this.a(e) : e;
      case 'aime': case 'naime': return w.ec === 'count' ? (w.enp || e + 's') : e;
      case 'ouest': return 'the ' + e;
      case 'cest': return w.ec === 'count' ? this.a(e) : e;
      case 'vais': return 'to the ' + e;
      default: return w.ec === 'count' ? this.a(e) : 'some ' + e;
    }
  },
  obj(w, s) {
    switch (w.k) {
      case 'noun': return this.noun(w, s);
      case 'body': return w.raw ? this.e(w) : 'my ' + this.e(w);
      case 'verb': return s === 'vais' ? 'to ' + this.e(w) : (s === 'aime' || s === 'naime') ? 'to ' + this.e(w) : 'to ' + this.e(w);
      case 'place': {
        const gb = GB() && Array.isArray(w.gb) ? w.gb : null;
        const ea = gb ? gb[1] : w.ea, ed = gb ? gb[2] : w.ed;
        if (s === 'vais') return ea;
        if (s === 'aime' || s === 'naime' || s === 'ouest' || s === 'cest') return ed;
        return 'to go ' + ea;
      }
      case 'pers': return s === 'vais' ? 'to see ' + persName(w) : persName(w);
      default: return this.e(w);
    }
  },
  feel(adj, av, fx) {
    const all = adj.concat(av, fx).map((w) => this.e(w));
    return all.length ? "I'm " + list(all, 'and') : '';
  },
  head(s, objs) { if (s === 'ouest' && objs.some((o) => o.ec === 'pl' || o.ec === 'mass' && o.k === 'noun' && /s$/.test(o.en))) return 'where are'; return WD[s].en; },
  and: 'and',
  infer(k) { return { body: 'mal', verb: 'veux', place: 'veux' }[k] || null; },
  q(s) { return s === 'ouest' ? '?' : ''; },
};

  <details><summary>${T('sAbout')}</summary><p class="hint">${T('about')}</p><p class="hint">${T('version')} ${APP_VERSION}</p><button class="btn danger" id="sReset">${T('reset')}</button></details>`;
}
function renderEditor() {
  const sc = S.scenes.find((x) => x.id === editSc), z = sc.zones[selZ];
  const qq = norm(zq.trim()), lib = libWords().filter((w) => !qq || norm(label(w)).includes(qq)).slice(0, qq ? 60 : 30);
  return `<div class="ptop"><h2>${esc(sc.name)}</h2><button class="btn primary" id="edDone">${T('done')}</button></div><p class="hint">${T('zHelp')}</p>
  <div class="edwrap"><svg class="edsvg" viewBox="0 0 ${sc.w} ${sc.h}"><image href="${sc.img}" width="${sc.w}" height="${sc.h}"/>${sc.zones.map((zz, i) => `<circle class="zc${i === selZ ? ' sel' : ''}" data-z="${i}" cx="${zz.x * sc.w}" cy="${zz.y * sc.h}" r="${zz.r * sc.w}"/>`).join('')}</svg></div>
  ${z ? `<fieldset class="add"><label class="f">${T('zName')}<input id="zName" value="${esc(z.name)}" autocomplete="off"></label>
    <label class="f">${T('zSize')}<input type="range" id="zSize" min="0.03" max="0.3" step="0.01" value="${z.r}"></label>
    <p class="flabel">${T('zChoices')}</p><div class="sel">${z.o.map((o, i) => { const v = optView(o); return `<button class="selc c-${v.col}" data-zrm="${i}" aria-label="${esc(T('remove') + ' ' + v.lb)}"><span class="mini">${v.ic}</span>${esc(v.lb)}${ui('close')}</button>`; }).join('')}</div>
    <label class="f">${T('search')}<input id="zS" type="search" value="${esc(zq)}" autocomplete="off"></label>
    <div class="lib">${lib.map((w) => `<button class="libw" data-zadd="${w.id}"><span class="mini">${pic(w)}</span><span>${esc(label(w))}</span></button>`).join('')}</div>
    <button class="btn danger" id="zDel">${ui('trash')}${T('del')}</button></fieldset>` : ''}`;
}
function renderAdult(msg) {
  const body = adultTab === 'ask' ? renderAsk() : adultTab === 'log' ? renderLog() : adultTab === 'write' ? renderWrite() : unlocked ? renderSettings() : renderLock(msg);
  const was = $$('#adult details').map((d) => d.open);
  $('#adult').innerHTML = `<div class="ahead"><button class="btn" data-close="adult">${ui('close')}${T('back')}</button></div>
    <div class="atabs" role="tablist">${[['ask', 'tAsk'], ['log', 'tLog'], ['write', 'tWrite'], ['set', 'tSet']].map(([k, t]) => `<button role="tab" aria-selected="${k === adultTab}" data-atab="${k}">${ui(k)}<span>${T(t)}</span></button>`).join('')}</div>
    <div class="abody">${body}</div>`;
  const ds = $$('#adult details'); if (was.length === ds.length) ds.forEach((d, i) => { d.open = was[i]; });
  $('#adult').hidden = false;
}
function resizeImg(file, max) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      res({ src: cv.toDataURL('image/jpeg', 0.78), w: cv.width, h: cv.height }); // shortcut: photos en base64 dans localStorage (~5 Mo), passer à @capacitor/filesystem dans l'appli native
    };
    img.onerror = rej; img.src = url;
  });
}

/* ---------- Thème, langue, démarrage ---------- */
function applyTheme() {
  const dark = S.theme === 'dark' || (S.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('meta[name=theme-color]').content = dark ? '#12161D' : '#F4F6F8';
}
function idleBubble() { const b = $('#bubble'); b.className = 'idle'; b.dataset.t = ''; b.innerHTML = `<span class="btx">${esc(T('hint'))}</span>`; }
function renderAll() { if ($('#bubble').classList.contains('idle')) idleBubble(); document.documentElement.lang = L(); document.title = T('app'); applyTheme(); renderUrg(); renderRooms(); renderScene(); if (sheetHot) renderSheet(); }
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2400); }

/* ---------- Événements ---------- */
document.addEventListener('click', (e) => {
  const zc = e.target.closest('.edsvg');
  if (zc) {
    const sc = S.scenes.find((x) => x.id === editSc), c = e.target.closest('[data-z]');
    if (c) selZ = +c.dataset.z;
    else { const pt = zc.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const q = pt.matrixTransform(zc.getScreenCTM().inverse()); sc.zones.push({ x: q.x / sc.w, y: q.y / sc.h, r: 0.08, name: '', o: [] }); selZ = sc.zones.length - 1; save(); }
    zq = ''; return renderAdult();
  }
  const b = e.target.closest('button, [data-hot]'); if (!b) return;
  const d = b.dataset;
  if (d.hot) return openSheet(d.hot);
  if (d.urg) {
    const u = URG.find((x) => x.id === d.urg); say(urgTxt(u)[1], picto(u.ic));
    if (u.id === 'mal') goScene('moi');
    return;
  }
  if (d.room) return goScene(d.room);
  if (d.o !== undefined) { const h = hotDef(sheetHot), o = h.o[+d.o]; const v = optView(o, h, neg); say(optText(o, neg), v.ic); return closeSheet(); }
  if (d.neg !== undefined) { neg = d.neg === '1'; return renderSheet(); }
  if (d.close === 'sheet') return closeSheet();
  if (d.close === 'adult') { $('#adult').hidden = true; unlocked = false; pin = firstPin = ''; editSc = null; view = 'child'; return renderAll(); }
  if (d.close === 'ask') { $('#ask').hidden = true; return; }
  if (d.open === 'adult') { view = 'adult'; closeSheet(); return renderAdult(); }
  if (d.open === 'ask') { ask.q = $('#askQ').value; return showAsk(); }
  if (d.again) { $('#ask').hidden = true; ask = { q: '', a: [] }; adultTab = 'ask'; view = 'adult'; return renderAdult(); }
  if (d.ans) {
    const w = word(d.ans); say(optText(defOpt(w)), pic(w));
    $$('#ask .opt').forEach((x) => x.classList.toggle('dim', x !== b)); $('.askfoot').hidden = false; return;
  }
  if (d.atab) { adultTab = d.atab; if (d.atab !== 'set') { unlocked = false; editSc = null; } return renderAdult(); }
  if (d.qq !== undefined) { const q = QUICKQ[+d.qq]; ask = { q: nm(q), a: q.a.slice() }; return renderAdult(); }
  if (d.lib) { ask.q = $('#askQ').value; const i = ask.a.indexOf(d.lib); if (i >= 0) ask.a.splice(i, 1); else if (ask.a.length < 4) ask.a.push(d.lib); return renderAdult(); }
  if (d.rma !== undefined) { ask.q = $('#askQ').value; ask.a.splice(+d.rma, 1); return renderAdult(); }
  if (d.d) return pinKey(d.d);
  if (d.pdel !== undefined) { S.people.splice(+d.pdel, 1); save(); return renderAdult(); }
  if (d.cdel) { S.custom = S.custom.filter((c) => c.id !== d.cdel); save(); return renderAdult(); }
  if (d.sedit) { editSc = d.sedit; selZ = -1; return renderAdult(); }
  if (d.sdel) { S.scenes = S.scenes.filter((s) => s.id !== d.sdel); if (scene === d.sdel) scene = 'cuisine'; save(); return renderAdult(); }
  if (d.zadd) { const z = S.scenes.find((x) => x.id === editSc).zones[selZ]; const o = defOpt(word(d.zadd)); if (z.o.length < 8 && !z.o.includes(o)) { z.o.push(o); if (!z.name) z.name = label(word(d.zadd)); } save(); return renderAdult(); }
  if (d.zrm !== undefined) { S.scenes.find((x) => x.id === editSc).zones[selZ].o.splice(+d.zrm, 1); save(); return renderAdult(); }
  switch (b.id) {
    case 'bubble': return b.dataset.t && speak(b.dataset.t);
    case 'logClr': if (confirm(T('logAsk'))) { S.log = []; save(); renderAdult(); } return;
    case 'wSay': { const x = $('#wTxt').value.trim(); if (x) { speak(x); logIt('c', x); } return; }
    case 'wClr': $('#wTxt').value = ''; return $('#wTxt').focus();
    case 'sTest': return speak(T('testText'));
    case 'sCode': S.code = ''; save(); unlocked = false; pin = firstPin = ''; return renderAdult();
    case 'pAdd': S.people.push({ id: 'p' + Date.now().toString(36), name: '' }); save(); return renderAdult();
    case 'nAdd': {
      const lab = $('#nLabel').value.trim(); if (!lab) return $('#nLabel').focus();
      S.custom.push({ id: 'c' + Date.now().toString(36), hot: objHot, label: lab, art: $('#nArt').value, img: newImg }); newImg = '';
      save(); toast(T('added')); return renderAdult();
    }
    case 'scNew': {
      const n = $('#scName').value.trim(); if (!n) return $('#scName').focus(); if (!newImg) return toast(T('choosePhoto'));
      const sc = { id: 's' + Date.now().toString(36), name: n, img: newImg, w: newDim.w, h: newDim.h, zones: [] };
      S.scenes.push(sc); newImg = ''; if (!save()) { S.scenes.pop(); return; }
      editSc = sc.id; selZ = -1; return renderAdult();
    }
    case 'edDone': editSc = null; renderRooms(); return renderAdult();
    case 'zDel': S.scenes.find((x) => x.id === editSc).zones.splice(selZ, 1); selZ = -1; save(); return renderAdult();
    case 'sExp': {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(Object.assign({ app: 'monmonde', v: APP_VERSION }, S, { code: '' }))], { type: 'application/json' }));
      a.download = 'mon-monde-sauvegarde.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); return;
    }
    case 'sReset': if (confirm(T('resetAsk'))) { const code = S.code; S = JSON.parse(JSON.stringify(DEF)); S.code = code; save(); renderAll(); renderAdult(); } return;
  }
});
let newDim = { w: 0, h: 0 };
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'askS') { query = t.value; $('#lib').innerHTML = libHTML(); }
  else if (t.id === 'zS') { zq = t.value; const pos = t.selectionStart; renderAdult(); const n = $('#zS'); n.focus(); n.setSelectionRange(pos, pos); }
  else if (t.id === 'askQ') ask.q = t.value;
  else if (t.id === 'zSize' || t.id === 'zName') {
    const z = S.scenes.find((x) => x.id === editSc).zones[selZ];
    if (t.id === 'zSize') { z.r = +t.value; const c = $(`.zc[data-z="${selZ}"]`); if (c) c.setAttribute('r', z.r * S.scenes.find((x) => x.id === editSc).w); } else z.name = t.value;
    save();
  }
});
document.addEventListener('change', async (e) => {
  const t = e.target, d = t.dataset;
  if (t.name === 'gender') S.gender = t.value;
  else if (t.name === 'theme') { S.theme = t.value; applyTheme(); }
  else if (t.id === 'sLang') { S.lang = t.value; S.voice = ''; save(); renderAll(); return renderAdult(); }
  else if (t.id === 'sAuto') S.auto = t.checked;
  else if (t.id === 'sVoice') S.voice = t.value;
  else if (t.id === 'sRate') S.rate = +t.value;
  else if (t.id === 'sPitch') S.pitch = +t.value;
  else if (t.id === 'sHot') { objHot = t.value; return renderAdult(); }
  else if (d.pname !== undefined) S.people[+d.pname].name = t.value.trim();
  else if (d.hide) { const a = S.hidden[objHot] || []; S.hidden[objHot] = t.checked ? a.filter((x) => x !== d.hide) : a.concat(d.hide); }
  else if (t.type === 'file' && t.files[0]) {
    try {
      if (t.id === 'sImp') {
        const j = JSON.parse(await t.files[0].text()); if (j.app !== 'monmonde') throw new Error('bad');
        const code = S.code; S = Object.assign({}, DEF, j, { code }); delete S.app; delete S.v; save(); renderAll(); toast(T('imported')); return renderAdult();
      }
      const big = t.id === 'scImg', r0 = await resizeImg(t.files[0], big ? 1000 : 260);
      if (t.id.startsWith('pimg')) { S.people[+t.id.slice(4)].img = r0.src; save(); return renderAdult(); }
      newImg = r0.src; newDim = r0; $(big ? '#scPrev' : '#nPrev').innerHTML = `<img src="${newImg}" alt="">`;
    } catch (err) { toast(T('badFile')); }
    return;
  } else return;
  save();
  if (t.name === 'gender' || t.id === 'sAuto') renderAll();
});
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g[data-hot]')) { e.preventDefault(); openSheet(e.target.dataset.hot); }
  if (e.key === 'Escape') { if (!$('#ask').hidden) $('#ask').hidden = true; else if (sheetHot) closeSheet(); }
});
$('#sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') closeSheet(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.auto && view === 'child' && !sheetHot && scene !== nowRoom() && SCENE_ART[scene] && Date.now() - lastTouch > 15 * 60e3) goScene(nowRoom()); });
let lastTouch = Date.now();
document.addEventListener('pointerdown', () => { lastTouch = Date.now(); }, true);

if (S.auto) scene = nowRoom();
renderAll();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('service-worker.js');
</script>
</body>
