<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F3F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Je Parle">
<meta name="description" content="Application de communication par pictogrammes pour enfants et adultes qui ne parlent pas ou peu.">
<title>Je Parle avec Toi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/FiraSans-SemiBold.woff" as="font" type="font/woff" crossorigin>
<style>@font-face { font-family: 'Fira Sans'; src: url(fonts/FiraSans-Regular.woff) format('woff'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Fira Sans'; src: url(fonts/FiraSans-SemiBold.woff) format('woff'); font-weight: 600 700; font-display: swap; }
:root {
  --bg: #F1F3F7; --surf: #FFFFFF; --ink: #172033; --mute: #566176; --line: #D5DBE5; --acc: #2F4BD8; --acc-ink: #FFFFFF; --plate: #FFFFFF;
  --pers: #E2AE00; --pers-t: #FFF4C7; --verb: #2E9A50; --verb-t: #DFF3E5; --desc: #2F7FE0; --desc-t: #DFEBFC;
  --noun: #E9821E; --noun-t: #FDE8D3; --soc: #D4428A; --soc-t: #FBE0EC; --q: #8A4FD6; --q-t: #EEE3FB; --neg: #D7383B; --neg-t: #FBDEDE;
  color-scheme: light;
}
[data-theme=dark] {
  --bg: #11161F; --surf: #1A2130; --ink: #EEF1F7; --mute: #A7B0C2; --line: #2E3749; --acc: #9DB0FF; --acc-ink: #0F1526; --plate: #F4F6FA;
  --pers: #F2C230; --pers-t: #3A3317; --verb: #4CC172; --verb-t: #183424; --desc: #66A3F2; --desc-t: #172B45;
  --noun: #F29A44; --noun-t: #3D2715; --soc: #EC6FAA; --soc-t: #3D1A2C; --q: #AE83EE; --q-t: #2C1F45; --neg: #F0605F; --neg-t: #41191B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: 'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ui { width: 24px; height: 24px; flex: none; }

#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
main { flex: 1; min-height: 0; display: flex; }
.view { flex: 1; min-width: 0; min-height: 0; }
.view[hidden] { display: none !important; }
#vTalk { display: flex; flex-direction: column; gap: 8px; padding: 8px; overflow: hidden; }
#vPhrases, #vWrite, #vParents { overflow-y: auto; padding: 16px max(16px, calc((100% - 720px) / 2)) 24px; }

/* Phrase */
.say-bar { background: var(--surf); border: 1px solid var(--line); border-radius: 16px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
#phrase { min-height: 44px; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 4px; }
.chips { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.chips:empty { display: none; }
.chip { flex: none; width: 34px; height: 34px; border-radius: 8px; background: var(--plate); border: 1px solid var(--line); padding: 2px; display: flex; }
.chip svg, .chip img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
#txt { font-size: clamp(21px, 5.4vw, 32px); font-weight: 600; line-height: 1.15; overflow-wrap: anywhere; }
.is-empty #txt { color: var(--mute); font-weight: 400; font-size: 18px; }
.acts { display: flex; gap: 6px; }
.acts .iconbtn { border: 1px solid var(--line); }
#bSay { margin-left: auto; min-width: 128px; min-height: 52px; border: 0; border-radius: 12px; background: var(--acc); color: var(--acc-ink); font-weight: 600; font-size: 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px; }
#bSay .ui { width: 28px; height: 28px; }

/* Mots essentiels */
#ess { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
@media (min-width: 720px) { #ess { grid-template-columns: repeat(8, 1fr); } }

/* Catégories */
#cats { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: none; padding: 1px; }
#cats::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
#cats button { flex: none; display: flex; align-items: center; gap: 6px; min-height: 48px; padding: 4px 14px 4px 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--surf); font-weight: 600; font-size: 16px; }
#cats button[aria-selected=true] { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.cpic { width: 38px; height: 38px; border-radius: 50%; background: var(--plate); padding: 3px; display: flex; }
.cpic svg { width: 100%; height: 100%; }
@media (min-width: 900px) { #cats button { flex: 1; justify-content: center; } }

/* Grille */
#grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); grid-template-rows: repeat(var(--n, 4), minmax(0, 1fr)); gap: 8px; }
.tile { --c: var(--line); --ct: var(--surf); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 0; min-height: 0; padding: 6px; border-radius: 14px; border: 3px solid var(--c); background: var(--ct); color: var(--ink); }
.tile .pic { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
.tile .pic svg, .tile .pic img { height: 100%; max-width: 100%; aspect-ratio: 1; background: var(--plate); border-radius: 10px; padding: 5%; object-fit: cover; }
.tile .pic img { padding: 0; }
.lbl { font-weight: 600; font-size: clamp(13px, calc(1.1vh + .9vw), 22px); line-height: 1.1; text-align: center; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; hyphens: auto; }
.slot { border-radius: 14px; }
.ess-t { min-height: 64px; padding: 4px 2px; gap: 2px; }
.ess-t .pic { flex: none; width: 34px; height: 34px; }
.ess-t .pic svg { padding: 2px; border-radius: 8px; }
.ess-t .lbl { font-size: 14px; -webkit-line-clamp: 1; }
.c-pers { --c: var(--pers); --ct: var(--pers-t); } .c-verb { --c: var(--verb); --ct: var(--verb-t); } .c-desc { --c: var(--desc); --ct: var(--desc-t); }
.c-noun { --c: var(--noun); --ct: var(--noun-t); } .c-soc { --c: var(--soc); --ct: var(--soc-t); } .c-q { --c: var(--q); --ct: var(--q-t); } .c-neg { --c: var(--neg); --ct: var(--neg-t); }
@media (prefers-reduced-motion: no-preference) { .tile { transition: transform .08s; } .tile:active { transform: scale(.96); } }

#pager { display: flex; align-items: center; gap: 8px; flex: none; }
#pager[hidden] { display: none; }
#pager .btn { flex: 1; justify-content: center; }
#pgTxt { min-width: 64px; text-align: center; font-weight: 600; color: var(--mute); }

/* Barre d'onglets */
#tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surf); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); flex: none; }
#tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; border: 0; background: none; color: var(--mute); font-size: 13px; font-weight: 600; padding: 8px 0 6px; border-top: 3px solid transparent; }
#tabs button[aria-current=page] { color: var(--acc); border-top-color: var(--acc); }

/* Commun */
h2 { font-size: 20px; margin: 8px 0 12px; }
.hint { color: var(--mute); line-height: 1.45; margin: 4px 0 12px; }
.btn { min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surf); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; position: relative; }
.btn.primary { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.btn.danger { color: var(--neg); border-color: var(--neg); }
.iconbtn { width: 48px; height: 48px; flex: none; border-radius: 12px; border: 0; background: var(--surf); display: inline-flex; align-items: center; justify-content: center; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.plist { list-style: none; margin: 0 0 20px; padding: 0; display: grid; gap: 8px; }
.plist li { display: flex; gap: 6px; align-items: stretch; }
.prow { flex: 1; text-align: left; background: var(--surf); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-height: 56px; justify-content: center; }
.pchips { display: flex; gap: 4px; flex-wrap: wrap; }
.pchips:empty { display: none; }
.ptxt { font-size: 19px; font-weight: 600; }
.plist .iconbtn { border: 1px solid var(--line); height: auto; }
textarea { width: 100%; min-height: 38vh; font-size: 26px; line-height: 1.3; border-radius: 16px; border: 1px solid var(--line); background: var(--surf); padding: 14px; resize: vertical; }

/* Code parent */
.lock { max-width: 340px; margin: 0 auto; text-align: center; }
.lock .err { color: var(--neg); font-weight: 600; }
.dots { display: flex; justify-content: center; gap: 14px; margin: 16px 0 22px; }
.dots span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); }
.dots .on { background: var(--ink); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pad button { height: 68px; border-radius: 16px; border: 1px solid var(--line); background: var(--surf); font-size: 28px; font-weight: 600; display: flex; align-items: center; justify-content: center; }

/* Réglages */
.ptop { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
details { background: var(--surf); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; padding: 0 16px; }
details[open] { padding-bottom: 16px; }
summary { font-weight: 600; font-size: 18px; min-height: 56px; display: flex; align-items: center; cursor: pointer; }
.f { display: grid; gap: 6px; margin: 12px 0; font-weight: 600; }
.f input:not([type=range]), .f select { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; font-size: 17px; font-weight: 400; }
.f input[type=range] { width: 100%; min-height: 40px; accent-color: var(--acc); }
.flabel { font-weight: 600; margin: 14px 0 6px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); font-weight: 600; cursor: pointer; }
.seg input:checked + span { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.seg input:focus-visible + span { outline: 3px solid var(--acc); outline-offset: 2px; }
.chk, .wchk { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.chk input, .wchk input { width: 22px; height: 22px; accent-color: var(--acc); }
.wlist { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.wlist li { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); }
.wlist .wchk { flex: 1; }
.mini { width: 40px; height: 40px; border-radius: 8px; background: var(--plate); padding: 2px; display: inline-flex; flex: none; }
.mini svg, .mini img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
.add { border: 1px dashed var(--line); border-radius: 12px; margin-top: 14px; padding: 4px 14px 14px; }
.add legend { font-weight: 600; padding: 0 6px; }
.photo { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
.photo .mini { width: 56px; height: 56px; }
#toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600; z-index: 9; }
#toast[hidden] { display: none; }
@media (max-height: 640px) { .chip { width: 26px; height: 26px; } .ess-t { min-height: 56px; } .ess-t .pic { width: 28px; height: 28px; } #cats button { min-height: 44px; } .cpic { width: 32px; height: 32px; } }
</style>
</head>
<body>
<div id="app">
  <main>
    <section class="view" id="vTalk" data-v="talk">
      <div class="say-bar">
        <div id="phrase" aria-live="polite"><div class="chips" id="chips"></div><div id="txt"></div></div>
        <div class="acts">
          <button class="iconbtn" id="bDel"><svg class="ui" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M12 9l6 6M18 9l-6 6"/></g></svg></button>
          <button class="iconbtn" id="bClr"><svg class="ui" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></g></svg></button>
          <button class="iconbtn" id="bKeep"><svg class="ui" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9z"/></g></svg></button>
          <button id="bSay"></button>
        </div>
      </div>
      <div id="ess"></div>
      <div id="cats" role="tablist"></div>
      <div id="grid"></div>
      <div id="pager"><button class="btn" id="pgPrev"><svg class="ui" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span id="pgTxt"></span><button class="btn" id="pgNext"><svg class="ui" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    </section>
    <section class="view" id="vPhrases" data-v="phrases" hidden></section>
    <section class="view" id="vWrite" data-v="write" hidden></section>
    <section class="view" id="vParents" data-v="parents" hidden></section>
  </main>
  <nav id="tabs"></nav>
</div>
<div id="toast" role="status" hidden></div>
<script>/* Pictogrammes dessinés pour l'appli (pas de licence tierce). Grille 64x64. */
const K = '#22293A', SK = '#F7CBA5', HB = '#6B4A2F', HG = '#C9CED6', HY = '#E3B04B',
  RED = '#E5484D', BLU = '#3B82F6', GRN = '#3BA55C', YEL = '#F7C948', ORA = '#F08A24',
  PUR = '#8B5CF6', PNK = '#F27BB0', BRN = '#9A6236', WH = '#FFFFFF', LB = '#BFE3FF', CRM = '#F6E3BE';
const NS = 'stroke="none"';
const c = (x, y, r, f = 'none', e = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${e}/>`;
const el = (x, y, rx, ry, f = 'none', e = '') => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" ${e}/>`;
const r = (x, y, w, h, rx, f = 'none', e = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" ${e}/>`;
const p = (d, f = 'none', e = '') => `<path d="${d}" fill="${f}" ${e}/>`;
const t = (x, y, s, txt, f = K) => `<text x="${x}" y="${y}" font-size="${s}" font-weight="700" font-family="Fira Sans,system-ui,sans-serif" fill="${f}" stroke="none" text-anchor="middle">${txt}</text>`;
const dot = (x, y, s = 1.6) => c(x, y, s, K, NS);

function face(cx, cy, R, mood = 'happy', fill = SK) {
  const ex = R * 0.36, ey = cy - R * 0.1, m = cy + R * 0.38;
  let s = c(cx, cy, R, fill), eyes = dot(cx - ex, ey, R * 0.09) + dot(cx + ex, ey, R * 0.09);
  const arc = (y1, y2) => p(`M${cx - R * .38} ${y1} Q${cx} ${y2} ${cx + R * .38} ${y1}`);
  switch (mood) {
    case 'happy': return s + eyes + arc(m - R * .08, m + R * .32);
    case 'sad': return s + eyes + arc(m + R * .18, m - R * .2) + p(`M${cx - ex - R * .2} ${ey - R * .3} L${cx - ex + R * .15} ${ey - R * .42} M${cx + ex + R * .2} ${ey - R * .3} L${cx + ex - R * .15} ${ey - R * .42}`) + el(cx + ex + R * .05, ey + R * .32, R * .07, R * .12, LB, NS);
    case 'angry': return c(cx, cy, R, '#F6A9A0') + eyes + p(`M${cx - ex - R * .22} ${ey - R * .38} L${cx - ex + R * .2} ${ey - R * .18} M${cx + ex + R * .22} ${ey - R * .38} L${cx + ex - R * .2} ${ey - R * .18}`) + arc(m + R * .12, m - R * .12);
    case 'tired': return s + p(`M${cx - ex - R * .14} ${ey} q${R * .14} ${R * .12} ${R * .28} 0 M${cx + ex - R * .14} ${ey} q${R * .14} ${R * .12} ${R * .28} 0`) + el(cx, m + R * .05, R * .1, R * .13, K, NS) + t(cx + R * .95, cy - R * .7, R * .55, 'z');
    case 'scared': return s + c(cx - ex, ey, R * .17, WH) + c(cx + ex, ey, R * .17, WH) + dot(cx - ex, ey, R * .07) + dot(cx + ex, ey, R * .07) + p(`M${cx - ex - R * .2} ${ey - R * .36} Q${cx - ex} ${ey - R * .5} ${cx - ex + R * .2} ${ey - R * .36} M${cx + ex - R * .2} ${ey - R * .36} Q${cx + ex} ${ey - R * .5} ${cx + ex + R * .2} ${ey - R * .36}`) + el(cx, m + R * .06, R * .13, R * .19, K, NS);
    case 'sick': return c(cx, cy, R, '#CDE7B0') + p(`M${cx - ex - R * .14} ${ey} h${R * .28} M${cx + ex - R * .14} ${ey} h${R * .28}`) + p(`M${cx - R * .34} ${m + R * .05} q${R * .11} -${R * .14} ${R * .22} 0 q${R * .11} ${R * .14} ${R * .22} 0 q${R * .11} -${R * .14} ${R * .22} 0`);
    case 'calm': return s + p(`M${cx - ex - R * .14} ${ey + R * .04} q${R * .14} -${R * .14} ${R * .28} 0 M${cx + ex - R * .14} ${ey + R * .04} q${R * .14} -${R * .14} ${R * .28} 0`) + arc(m - R * .05, m + R * .18);
    case 'surprised': return s + c(cx - ex, ey, R * .12, WH) + c(cx + ex, ey, R * .12, WH) + dot(cx - ex, ey, R * .06) + dot(cx + ex, ey, R * .06) + c(cx, m + R * .08, R * .17, K, NS);
    case 'pain': return s + p(`M${cx - ex - R * .16} ${ey - R * .12} l${R * .26} ${R * .12} l-${R * .26} ${R * .12} M${cx + ex + R * .16} ${ey - R * .12} l-${R * .26} ${R * .12} l${R * .26} ${R * .12}`) + p(`M${cx - R * .34} ${m + R * .08} q${R * .11} -${R * .16} ${R * .22} 0 q${R * .11} ${R * .16} ${R * .22} 0 q${R * .11} -${R * .16} ${R * .22} 0`);
    case 'open': return s + eyes + el(cx, m + R * .05, R * .2, R * .16, '#8A2A2F');
    default: return s + eyes + p(`M${cx - R * .25} ${m + R * .05} h${R * .5}`);
  }
}

/* Personnage : x centre, s échelle (1 adulte, .74 enfant), o = {hair, hc, shirt, glasses, mood} */
function person(x, s, o = {}) {
  const top = 61 - 50 * s, hr = 7.6 * s, hy = top + 8.5 * s, hc = o.hc || HB, sh = o.shirt || BLU;
  const cap = p(`M${x - hr} ${hy + 1 * s} Q${x - hr - 1 * s} ${hy - hr * 1.35} ${x} ${hy - hr * 1.05} Q${x + hr + 1 * s} ${hy - hr * 1.35} ${x + hr} ${hy + 1 * s} Q${x} ${hy - hr * .55} ${x - hr} ${hy + 1 * s}Z`, hc);
  let back = '', front = '';
  if (o.hair === 'long') back = p(`M${x - hr - 1.5 * s} ${hy} Q${x - hr - 3 * s} ${hy + hr * 1.7} ${x - hr + 2 * s} ${hy + hr * 1.8} L${x + hr - 2 * s} ${hy + hr * 1.8} Q${x + hr + 3 * s} ${hy + hr * 1.7} ${x + hr + 1.5 * s} ${hy}Z`, hc);
  if (o.hair === 'bun') back = c(x, hy - hr * 1.1, hr * .45, hc);
  if (o.hair === 'pig') back = c(x - hr - 1.5 * s, hy - 1 * s, hr * .45, hc) + c(x + hr + 1.5 * s, hy - 1 * s, hr * .45, hc);
  if (o.hair !== 'bald') front = cap; else front = p(`M${x - hr} ${hy} q${-1 * s} ${-hr * .6} ${hr * .3} ${-hr * .7} M${x + hr} ${hy} q${1 * s} ${-hr * .6} ${-hr * .3} ${-hr * .7}`, 'none', `stroke="${HG}" stroke-width="${3 * s}"`);
  const ey = hy + .5 * s;

/* ---------- Grammaire française ---------- */
const VOY = /^[aeiouyàâäéèêëîïôöûüœ]/i;
const grammarFR = {
  def(w) { return w.g === 'p' ? 'les ' + w.fr : VOY.test(w.fr) ? "l'" + w.fr : (w.g === 'f' ? 'la ' : 'le ') + w.fr; },
  indef(w) {
    if (w.g === 'p') return 'des ' + w.fr;
    if (w.m) return (VOY.test(w.fr) ? "de l'" : w.g === 'f' ? 'de la ' : 'du ') + w.fr;
    return (w.g === 'f' ? 'une ' : 'un ') + w.fr;
  },
  de(s) { return (VOY.test(s) ? "d'" : 'de ') + s; },
  a(w) { return w.raw ? w.fr : w.g === 'p' ? 'aux ' + w.fr : VOY.test(w.fr) ? "à l'" + w.fr : (w.g === 'f' ? 'à la ' : 'au ') + w.fr; },
  noun(w, s) {
    if (w.pos) return s === 'besoin' ? this.de(w.pos) : s === 'vais' ? 'à ' + w.pos : w.pos;
    if (w.d && s !== 'neveux' && s !== 'besoin') return this.def(w);
    switch (s) {
      case 'neveux': return this.de(w.fr);

/* ---------- Grammaire anglaise ---------- */
const grammarEN = {
  e(w) { return (GB() && w.gb && typeof w.gb === 'string') ? w.gb : w.en; },

  obj(w, s) {

  and: 'and',

/* ---------- Mots (de base + ajoutés) ---------- */
const WD = {};

const ART = { 'un': { g: 'm', ec: 'count' }, 'une': { g: 'f', ec: 'count' }, 'du': { g: 'm', m: 1, ec: 'mass' }, 'de la': { g: 'f', m: 1, ec: 'mass' }, "de l'": { g: 'm', m: 1, ec: 'mass' }, 'des': { g: 'p', ec: 'pl' }, 'mon': { pos: 1 }, 'ma': { pos: 1 }, 'mes': { pos: 1 }, '': { pos: 1 } };
const PREP = ['au', 'à la', "à l'", 'aux', 'chez', 'dans', ''];
function customWord(c) {

  if (c.cat === 'debut') return Object.assign(base, { k: 'pers', fr: c.label, en: c.label });

/* ---------- Composition de la phrase ---------- */
function compose(tokens) {
  const fr = L() === 'fr', G = fr ? grammarFR : grammarEN;

  const clauses = []; let cur = null;
  ws.forEach((w) => {
    if (w.k === 'start') { cur = { s: w.id, o: [] }; clauses.push(cur); }
    else if (w.k === 'soc' || w.k === 'q') { clauses.push({ txt: fr ? w.fr : w.en }); cur = null; }
    else { if (!cur) { cur = { s: null, o: [] }; clauses.push(cur); } cur.o.push(w); }
  });
  const out = clauses.map((c) => {
    if (c.txt) return c.txt;
    let s = c.s;
    const feels = c.o.filter((w) => w.k === 'feel'), rest = c.o.filter((w) => w.k !== 'feel');
    const parts = [];
    if (feels.length) parts.push(G.feel(feels.filter((w) => !w.av && !w.fx), feels.filter((w) => w.av), feels.filter((w) => w.fx), S.gender));
    if (feels.length && !rest.length && (!s || s === 'suis')) return parts.join('');
    if (!s && rest.length) s = G.infer(rest[0].k);
    if (!s) parts.unshift(list(rest.map((w) => (w.k === 'pers' ? persName(w) : fr ? (w.pos || w.fr) : (w.epos || grammarEN.e(w)))), G.and));
    else if (!fr && s === 'mal') {
      if (!rest.length) parts.unshift('it hurts');
      else if (rest.some((w) => w.raw)) parts.unshift('I hurt everywhere');
      else parts.unshift(list(rest.map((w) => grammarEN.obj(w, s)), 'and') + (rest.length > 1 || rest[0].pl ? ' hurt' : ' hurts'));
    } else {
      const head = G.head(s, rest);
      parts.unshift(rest.length ? head + ' ' + list(rest.map((w) => G.obj(w, s, S.gender)), G.and) + G.q(s) : head);
    }
    return parts.join(' ' + G.and + ' ');
  }).filter(Boolean);
  if (!out.length) return voc;
  let txt = out.join(', ');
  if (voc) txt = voc + ', ' + txt;
  return cap(txt);
}

let wCat = 'manger', newImg = '';
function opt(v, txt, cur) { return `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(txt)}</option>`; }
function seg(name, items, cur) { return `<div class="seg" role="radiogroup">${items.map(([v, t]) => `<label><input type="radio" name="${name}" value="${v}"${String(v) === String(cur) ? ' checked' : ''}><span>${esc(t)}</span></label>`).join('')}</div>`; }
function renderParents() {
  const lv = voices.filter((v) => v.lang.replace('_', '-').startsWith(L()));
  const ws = allWords().filter((w) => w.cat === wCat);
  const place = wCat === 'lieux', pers = wCat === 'debut';
  const was = [...document.querySelectorAll('#vParents details')].map((d) => d.open);
  $('#vParents').innerHTML = `<div class="ptop"><h2>${T('lockTitle')}</h2><button class="btn" id="pClose">${ui('parents')}${T('close')}</button></div>
  <details open><summary>${T('sChild')}</summary>
    ${seg('gender', [['f', T('girl')], ['m', T('boy')]], S.gender)}
    <label class="f">${T('lang')}<select id="pLang">${opt('fr', 'Français', S.lang)}${opt('en-US', 'English (US)', S.lang)}${opt('en-GB', 'English (UK)', S.lang)}</select></label>
  </details>
  <details><summary>${T('sDisplay')}</summary>
    <p class="flabel">${T('gridSize')}</p>${seg('grid', [[2, '4'], [3, '9'], [4, '16'], [5, '25']], S.grid)}
    <p class="flabel">${T('theme')}</p>${seg('theme', [['auto', T('tAuto')], ['light', T('tLight')], ['dark', T('tDark')]], S.theme)}
    <label class="chk"><input type="checkbox" id="pSayW"${S.sayWords ? ' checked' : ''}> ${T('sayWords')}</label>
  </details>
  <details><summary>${T('sVoice')}</summary>
    <label class="f">${T('voice')}<select id="pVoice">${opt('', T('vDefault'), S.voice)}${lv.map((v) => opt(v.voiceURI, v.name + ' (' + v.lang + ')', S.voice)).join('')}</select></label>
    <label class="f">${T('rate')}<input type="range" id="pRate" min="0.6" max="1.3" step="0.05" value="${S.rate}"></label>
    <label class="f">${T('pitch')}<input type="range" id="pPitch" min="0.7" max="1.4" step="0.05" value="${S.pitch}"></label>
    <button class="btn" id="pTest">${ui('say')}${T('test')}</button>
  </details>
  <details id="dWords"><summary>${T('sWords')}</summary>
    <label class="f">${T('category')}<select id="pCat">${CATS.map((c) => opt(c.id, c[L()], wCat)).join('')}</select></label>
    <p class="hint">${T('wordsHelp')}</p>
    <ul class="wlist">${ws.map((w) => `<li><label class="wchk"><input type="checkbox" data-vis="${w.id}"${S.hidden.includes(w.id) ? '' : ' checked'}><span class="mini">${pic(w)}</span><span>${esc(label(w))}</span></label>
      ${w.k === 'pers' && !w.custom ? `<button class="iconbtn" data-ren="${w.id}" aria-label="${esc(T('rename') + ' ' + label(w))}">${ui('write')}</button>` : ''}
      ${w.custom ? `<button class="iconbtn" data-del="${w.id}" aria-label="${esc(T('remove') + ' ' + label(w))}">${ui('trash')}</button>` : ''}</li>`).join('')}</ul>
    ${['debut', 'manger', 'lieux', 'objets'].includes(wCat) ? `<fieldset class="add"><legend>${T('addWord')}</legend>
      <label class="f">${T('word')}<input id="nLabel" autocomplete="off"></label>
      ${pers ? '' : `<label class="f">${place ? T('howPlace') : T('how')}<select id="nArt">${(place ? PREP : Object.keys(ART)).map((a) => opt(a, a || T('none'), place ? 'au' : 'un')).join('')}</select></label>`}
      <div class="photo"><span class="mini" id="nPrev">${newImg ? `<img src="${newImg}" alt="">` : picto('photo')}</span><label class="btn">${T('choosePhoto')}<input type="file" id="nImg" accept="image/*" class="sr"></label></div>
      <button class="btn primary" id="nAdd">${T('add')}</button></fieldset>` : ''}
  </details>
  <details><summary>${T('sSecurity')}</summary><button class="btn" id="pCode">${T('newCode')}</button></details>
  <details><summary>${T('sBackup')}</summary><div class="row"><button class="btn" id="pExp">${T('export')}</button><label class="btn">${T('import')}<input type="file" id="pImp" accept="application/json,.json" class="sr"></label></div></details>
  <details><summary>${T('sAbout')}</summary><p class="hint">${T('about')}</p><p class="hint">${T('version')} ${APP_VERSION}</p><button class="btn danger" id="pReset">${T('reset')}</button></details>`;
  const ds = document.querySelectorAll('#vParents details');
  if (was.length === ds.length) ds.forEach((d, i) => { d.open = was[i]; });
}
function resizeImg(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = 240 / Math.max(img.width, img.height), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * Math.min(1, s)); cv.height = Math.round(img.height * Math.min(1, s));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', 0.82)); // shortcut: photos en base64 dans localStorage (~5 Mo max), passer à @capacitor/filesystem dans l'appli native
    };
    img.onerror = rej; img.src = url;
  });
}

/* ---------- Navigation et thème ---------- */
function applyTheme() {
  const dark = S.theme === 'dark' || (S.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('meta[name=theme-color]').content = dark ? '#151B26' : '#F1F3F7';
}
function applyLang() {
  document.documentElement.lang = L();
  $('#bSay').innerHTML = ui('say') + `<span>${T('say')}</span>`;
  $('#bDel').setAttribute('aria-label', T('del')); $('#bClr').setAttribute('aria-label', T('clear')); $('#bKeep').setAttribute('aria-label', T('keep'));
  $('#pgPrev').setAttribute('aria-label', T('prev')); $('#pgNext').setAttribute('aria-label', T('next'));
  $('#tabs').innerHTML = [['talk', 'tTalk'], ['phrases', 'tPhrases'], ['write', 'tWrite'], ['parents', 'tParents']].map(([v, k]) => `<button data-view="${v}" aria-current="${v === view ? 'page' : 'false'}">${ui(v)}<span>${T(k)}</span></button>`).join('');
}
function show(v) {
  if (view === 'parents' && v !== 'parents') { unlocked = false; pin = firstPin = ''; }
  view = v;
  document.querySelectorAll('.view').forEach((el) => { el.hidden = el.dataset.v !== v; });
  document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-current', b.dataset.view === v ? 'page' : 'false'));
  if (v === 'phrases') renderPhrases();
  if (v === 'write' && !$('#wTxt')) renderWrite();
  if (v === 'parents') (unlocked ? renderParents() : renderLock());
  if (v === 'talk') { renderPhrase(); renderGrid(); }
}
function renderAll() { applyTheme(); applyLang(); renderEss(); renderCats(); renderGrid(); renderPhrase(); }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200); }

/* ---------- Événements ---------- */
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.closest('#ess')) {
    const w = ESS.find((x) => x.id === b.dataset.id), v = w[L() === 'fr' ? 'fr' : GB() && w.gb ? 'gb' : 'en'];
    const p0 = tokens.length === 1 && word(tokens[0]).k === 'pers' ? word(tokens[0]) : null; // « Maman » puis « Aide » → « Maman, j'ai besoin d'aide »
    speak(p0 ? persName(p0) + ', ' + (/^I\b/.test(v[1]) ? v[1] : v[1].charAt(0).toLowerCase() + v[1].slice(1)) : v[1]);
    if (w.id === 'mal' && p0) { tokens.push('mal'); renderPhrase(); goCat('corps'); return; }
    if (w.id === 'mal') { tokens = ['mal']; renderPhrase(); goCat('corps'); }
    return;
  }
  if (b.closest('#grid')) return addToken(b.dataset.id);
  if (b.dataset.cat) return goCat(b.dataset.cat);
  if (b.dataset.view) return show(b.dataset.view);
  switch (b.id) {
    case 'bSay': return sayAll();
    case 'bDel': tokens.pop(); renderPhrase(); if (!tokens.length) goCat('debut'); return;
    case 'bClr': tokens = []; renderPhrase(); goCat('debut'); return;
    case 'bKeep': if (tokens.length) { S.saved.unshift({ t: tokens.slice() }); save(); toast(T('kept')); } return;
    case 'pgPrev': pages[cat]--; return renderGrid();
    case 'pgNext': pages[cat]++; return renderGrid();
    case 'wSay': return speak($('#wTxt').value.trim());
    case 'wClr': $('#wTxt').value = ''; return $('#wTxt').focus();
    case 'wKeep': { const x = $('#wTxt').value.trim(); if (x) { S.saved.unshift({ x }); save(); toast(T('kept')); } return; }
    case 'pClose': return show('talk');
    case 'pTest': return speak(T('testText'));
    case 'pCode': S.code = ''; save(); unlocked = false; pin = firstPin = ''; return renderLock();
    case 'pExp': {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(Object.assign({ app: 'jpat', v: APP_VERSION }, S, { code: '' }), null, 1)], { type: 'application/json' }));
      a.download = 'je-parle-avec-toi-sauvegarde.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); return;
    }
    case 'pReset': if (confirm(T('resetAsk'))) { const code = S.code; S = Object.assign({}, DEF, { code }); save(); tokens = []; renderAll(); renderParents(); } return;
    case 'nAdd': {
      const lab = $('#nLabel').value.trim(); if (!lab) return $('#nLabel').focus();
      S.custom.push({ id: 'c' + Date.now().toString(36), cat: wCat, label: lab, art: $('#nArt') ? $('#nArt').value : '', img: newImg });
      newImg = ''; save(); renderParents(); toast(T('added')); return;
    }
  }
  if (b.dataset.d) return pinKey(b.dataset.d);
  if (b.classList.contains('prow')) { const toks = b.dataset.kind === 'saved' ? S.saved[b.dataset.i].t : S.history[b.dataset.i]; return speak(toks ? compose(toks) : S.saved[b.dataset.i].x); }
  if (b.dataset.rm) { S.saved.splice(+b.dataset.rm, 1); save(); return renderPhrases(); }
  if (b.dataset.del) { S.custom = S.custom.filter((c) => c.id !== b.dataset.del); save(); return renderParents(); }
  if (b.dataset.ren) {
    const w = word(b.dataset.ren), v = prompt(T('rename'), label(w));
    if (v !== null) { if (v.trim()) S.labels[w.id] = v.trim(); else delete S.labels[w.id]; save(); renderParents(); }
  }
});
document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.name === 'gender') S.gender = t.value;
  else if (t.name === 'grid') S.grid = +t.value;
  else if (t.name === 'theme') { S.theme = t.value; applyTheme(); }
  else if (t.id === 'pLang') { S.lang = t.value; S.voice = ''; save(); renderAll(); return renderParents(); }
  else if (t.id === 'pSayW') S.sayWords = t.checked;
  else if (t.id === 'pVoice') S.voice = t.value;
  else if (t.id === 'pRate') S.rate = +t.value;
  else if (t.id === 'pPitch') S.pitch = +t.value;
  else if (t.id === 'pCat') { wCat = t.value; return renderParents(); }
  else if (t.dataset.vis) { const id = t.dataset.vis; S.hidden = t.checked ? S.hidden.filter((x) => x !== id) : S.hidden.concat(id); }
  else if (t.id === 'nImg' && t.files[0]) {
    try { newImg = await resizeImg(t.files[0]); $('#nPrev').innerHTML = `<img src="${newImg}" alt="">`; } catch (err) { toast(T('badFile')); }
    return;
  } else if (t.id === 'pImp' && t.files[0]) {
    try {
      const d = JSON.parse(await t.files[0].text());
      if (d.app !== 'jpat') throw new Error('bad');
      const code = S.code; S = Object.assign({}, DEF, d, { code }); delete S.app; delete S.v;
      save(); tokens = []; renderAll(); renderParents(); toast(T('imported'));
    } catch (err) { toast(T('badFile')); }
    return;
  } else return;
  save(); if (t.name === 'gender' || t.name === 'grid' || t.dataset.vis) { renderGrid(); renderPhrase(); }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

renderAll();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('service-worker.js');
</script>
